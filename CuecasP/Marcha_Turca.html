<script>
/* ////// Datos de Partituras y Letras ////// */
const partituras = {
    'C': `
X:1
T: MARCHA TURKA RÍTMICA
M:4/4
L:1/4
K: none
V: 1
Q: "Md 1"
|| c2 c2 | c c c2 | c2 c2 | c c c2 :||
|| c c c2 | c c c2 | c c c2 | c c c2 ||
Q: "Md 2"
|| c2 c2 | c c c2 | c2 c2 | c c c2 ||
|| c c c2 | c c c2 | c c c2 | c c c2 ||
|| c2 c2 | c c c2 | c2 c2 | c c c2 ||
Q: "Md 3"
||: c2 c2 | c c c2 | c2 c2 | c c c2 :||
Q: "Md 4"
||: c/c/ c/c/ c/c/ c/c/ | c/c/ c/c/ c/c/ c/c/ | c/c/ c/c/ c/c/ c/c/ | c/c/ c/c/ c2 :||
`,
    'A': `
X
`,
};

const Letras = {
    'L': `
`,
};

/* Función principal para cambiar el contenido */
function cambiarTonalidad(tono) {
    const partituraContainer = document.getElementById('partitura-container');
    const letraContainer = document.getElementById('letra-container');
    
    // Verificación básica
    if (!partituraContainer || !letraContainer) {
        console.error('Error: Contenedores no encontrados');
        return;
    }

    // Lógica para mostrar Letra
    if (tono === 'L') {
        partituraContainer.style.display = 'none';
        letraContainer.style.display = 'block';
        
        // El formato <pre> se maneja con el CSS, solo inyectamos el HTML de la letra
        letraContainer.innerHTML = `<pre>${Letras['L']}</pre>`;
    } else {
        // Lógica para mostrar Partitura
        partituraContainer.style.display = 'block';
        letraContainer.style.display = 'none';
        partituraContainer.innerHTML = ''; // Limpiar

        const abc = partituras[tono];

        // Función de renderizado real, envuelta en try/catch
        const renderizar = () => {
            if (typeof ABCJS !== 'undefined' && ABCJS.renderAbc) {
                try {
                    const visualObj = ABCJS.renderAbc(partituraContainer, abc, {
                        responsive: 'resize',
                        paddingbottom: 50,
                        paddingright: 50,
                        scale: 1.5,
                        add_classes: true
                    });

                    // Inicializar controles de audio si el plugin está disponible
                    const audioControlsId = 'audio-controls';
                    let audioControls = document.getElementById(audioControlsId);
                    if (!audioControls) {
                        audioControls = document.createElement('div');
                        audioControls.id = audioControlsId;
                        audioControls.style.marginTop = '8px';
                        partituraContainer.parentNode.insertBefore(audioControls, partituraContainer.nextSibling);
                    }

                    if (ABCJS.synth && ABCJS.synth.CreateSynth && ABCJS.synth.SynthController) {
                        // Si ya hay un sintetizador anterior, intentar detenerlo
                        if (window._abcjsSynth) {
                            try { window._abcjsSynth.stop(); } catch (e) { /* ignore */ }
                        }

                        const synth = new ABCJS.synth.CreateSynth();
                        synth.init({ visualObj: visualObj[0] }).then(() => {
                            window._abcjsSynth = synth;
                            const ctrl = new ABCJS.synth.SynthController();
                            // Cargar los controles dentro del contenedor
                            ctrl.load('#' + audioControlsId, synth, {
                                displayPlay: true,
                                displayProgress: true,
                                displayLoop: true,
                                displayRestart: true
                            });
                        }).catch((e) => {
                            console.warn('No se pudo inicializar el sintetizador:', e);
                            audioControls.innerHTML = '<p style="color:gray;font-size:0.9em;text-align:center;">Controles de audio no disponibles.</p>';
                        });
                    } else {
                        // Plugin de audio no cargado
                        audioControls.innerHTML = '<p style="color:gray;font-size:0.9em;text-align:center;">Controles de audio no disponibles (plugin no cargado).</p>';
                    }

                } catch (error) {
                    console.error('Error al renderizar partitura:', error);
                    partituraContainer.innerHTML = '<p style="color: red; text-align: center;">Error al mostrar la partitura.</p>';
                }
            } else {
                 partituraContainer.innerHTML = '<p style="color: red; text-align: center;">Librería ABCJS no disponible (problema de red/carga).</p>';
            }
        };

        // Si ABCJS ya está disponible, renderiza inmediatamente.
        if (typeof ABCJS !== 'undefined') {
            renderizar();
        } else {
            // Si no está listo (debido a 'defer'), espera al evento 'load' o al script en sí
            // Aquí confiamos en el atributo 'defer' y esperamos un poco.
            setTimeout(renderizar, 100); 
        }
    }
}

/* Inicialización: Usamos DOMContentLoaded para definir la función, y llamamos a cambiarTonalidad
   después de un pequeño retraso para asegurar que los scripts con 'defer' tengan tiempo de cargar. */
document.addEventListener('DOMContentLoaded', function() {
    // Inicializar mostrando la Letra y Acordes
    cambiarTonalidad('C'); 
});
</script>

<script>
/* Fallback loader para abcjs-audio: intenta varios CDNs y re-inicializa la partitura */
(function(){
    const audioUrls = [
        'https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-audio-min.js',
        'https://unpkg.com/abcjs@6.2.3/dist/abcjs-audio-min.js',
        'https://cdn.jsdelivr.net/gh/paulrosen/abcjs@6.2.3/dist/abcjs-audio-min.js',
        '../vendor/abcjs-audio-min.js' // Fallback local (archivo placeholder o la librería real)
    ];

    function loadScript(url){
        return new Promise((resolve, reject) => {
            // Evitar recargar si ya existe            wget -O vendor/abcjs-audio-min.js https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-audio-min.js
            if (document.querySelector('script[src="' + url + '"]')) return resolve();
            const s = document.createElement('script');
            s.src = url;
            s.onload = () => resolve(url);
            s.onerror = () => reject(url);
            document.head.appendChild(s);
        });
    }

    function tryLoad(urls, idx = 0){
        if (idx >= urls.length) {
            console.warn('No se pudo cargar abcjs-audio desde los CDNs configurados.');
            const ac = document.getElementById('audio-controls');
            if (ac) ac.innerHTML = '<p style="color:gray;font-size:0.9em;text-align:center;">Controles de audio no disponibles — intenta recargar o descarga <code>abcjs-audio-min.js</code> localmente.</p>';
            return;
        }
        loadScript(urls[idx]).then((u) => {
            console.log('abcjs-audio cargado desde:', u);
            // Si ya se había renderizado la partitura, reintentar inicializar controles
            try { if (typeof cambiarTonalidad === 'function') cambiarTonalidad('C'); } catch (e) { console.warn(e); }
        }).catch(() => {
            console.warn('Fallo al cargar:', urls[idx], '— intentando siguiente');
            tryLoad(urls, idx + 1);
        });
    }

    // Dar un pequeño margen para que el script básico de ABCJS se cargue
    setTimeout(function(){
        if (window.ABCJS && (!ABCJS.synth || !ABCJS.synth.CreateSynth)) {
            tryLoad(audioUrls);
        }
    }, 600);
})();
</script>
