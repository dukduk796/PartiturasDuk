    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js" defer></script>
    <meta name="google" content="notranslate">

<body>

        <button onclick="cambiarTonalidad('L')">(Letra y Acordes)</button>

<footer>Todos los derechos reservados. Douglas Suarez Zubieta</footer>

<script>
/* ////// Datos de Partituras y Letras ////// */
const partituras = {
    'C': `
X:1
T:
C: Revisión y Transcripción
C: Douglas Suarez Zubieta
M:2/4
L:1/4
K:C
V:1
Q:"Md"
 ||: c//d//e//d// e/d/ | e/d/ e/g/ | d3/2 c/ | B2 | A//B//c//B// c/B/ | c/B/ c/e/ | B3/2 A/  | G2 |
w: | C |  |  | G | Am  |   |   | Em |
 | F//G//A//G// A/G/ | A/G/ A/B/ | c3/2 A/ | G2 | c//d//e//d// e/d/ | d/c/ B/d/ |1 c2 :|2 c3/2 A/ ||
w: | F |  |  | C | Dm  | G | C |
Q:"Bajos"
 ||: c3/2 e/ | g2 | e//d//e//d// c/A/ | G3/2 G/ | B3/2 c/ | d2 | d//e//f//e// d/e/ | c2 :||
w: | C |  |  | G |  | F |  | C | 
`,
    'A': `
X:1
T:
C: Revisión y Transcripción
C: Douglas Suarez Zubieta
M:2/4
L:1/4
K:A
V:1
`,
};

const Letras = {
    'L': `
  C
//al año que viene 
                     G
volveré a bailar por ti
Am            
al año que viene 
                    Em
volveré a soñar por ti

F   
suenan las matracas 
                   C
de este pobre corazón
Dm  
linda morenita 
  G            C
idilio de mi amor//

  C                          G
//regresaras morenita bella flor
             F               C
te esperare tesorito de mi amor// 
`
};

/* Función principal para cambiar el contenido */
function cambiarTonalidad(tono) {
    const partituraContainer = document.getElementById('partitura-container');
    const letraContainer = document.getElementById('letra-container');
    
    // Verificación básica
    if (!partituraContainer || !letraContainer) {
        console.error('Error: Contenedores no encontrados');
        return;
    }

    // Lógica para mostrar Letra
    if (tono === 'L') {
        partituraContainer.style.display = 'none';
        letraContainer.style.display = 'block';
        
        // El formato <pre> se maneja con el CSS, solo inyectamos el HTML de la letra
        letraContainer.innerHTML = `<pre>${Letras['L']}</pre>`;
    } else {
        // Lógica para mostrar Partitura
        partituraContainer.style.display = 'block';
        letraContainer.style.display = 'none';
        partituraContainer.innerHTML = ''; // Limpiar

        const abc = partituras[tono];

        // Función de renderizado real, envuelta en try/catch
        const renderizar = () => {
            if (typeof ABCJS !== 'undefined' && ABCJS.renderAbc) {
                try {
                    ABCJS.renderAbc(partituraContainer, abc, {
                        responsive: 'resize',
                        paddingbottom: 50,
                        paddingright: 50,
                        scale: 1.5,
                        add_classes: true
                    });
                } catch (error) {
                    console.error('Error al renderizar partitura:', error);
                    partituraContainer.innerHTML = '<p style="color: red; text-align: center;">Error al mostrar la partitura.</p>';
                }
            } else {
                 partituraContainer.innerHTML = '<p style="color: red; text-align: center;">Librería ABCJS no disponible (problema de red/carga).</p>';
            }
        };

        // Si ABCJS ya está disponible, renderiza inmediatamente.
        if (typeof ABCJS !== 'undefined') {
            renderizar();
        } else {
            // Si no está listo (debido a 'defer'), espera al evento 'load' o al script en sí
            // Aquí confiamos en el atributo 'defer' y esperamos un poco.
            setTimeout(renderizar, 100); 
        }
    }
}

/* Inicialización: Usamos DOMContentLoaded para definir la función, y llamamos a cambiarTonalidad
   después de un pequeño retraso para asegurar que los scripts con 'defer' tengan tiempo de cargar. */
document.addEventListener('DOMContentLoaded', function() {
    // Inicializar mostrando la Letra y Acordes
    cambiarTonalidad('L'); 
});
</script>

</body>
</html>
